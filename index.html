<html lang="en">
<head>
<meta charset="utf-8">

<title>Dr. Ulrike K. Steiner | Gynecology, Calgary</title>
<meta name="description" content="Gynecological care in Calgary, Alberta with Dr. Ulrike K. Steiner. Request an appointment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f0;--bg2:#f1ece0;--ink:#252826;--mute:#555d57;--g:#1f3a2e;--sage:#8fa392;--champ:#d9c8a4;--line:#d8d2c2;--card:#fffdf8;--on-g:#faf7f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--bg2:#1b231f;--ink:#ece8dc;--mute:#aeb7b0;--g:#a9c4b0;--sage:#5f7864;--champ:#c9b88f;--line:#2f3a34;--card:#19211d;--on-g:#10170f}}
:root[data-theme="dark"]{--bg:#141a17;--bg2:#1b231f;--ink:#ece8dc;--mute:#aeb7b0;--g:#a9c4b0;--sage:#5f7864;--champ:#c9b88f;--line:#2f3a34;--card:#19211d;--on-g:#10170f}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;color:var(--g);line-height:1.12;margin:0 0 .5em}
h1{font-size:clamp(2.4rem,6vw,4.2rem)}h2{font-size:clamp(1.8rem,3.6vw,2.6rem)}h3{font-size:1.4rem}
p{margin:0 0 1em;max-width:62ch}a{color:var(--g)}
:focus-visible{outline:3px solid var(--sage);outline-offset:3px;border-radius:3px}
body:before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.topbar{background:var(--g);color:var(--on-g);font-size:.85rem;text-align:center;padding:7px 12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.pic{object-position:50% 15%;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:200px 200px 14px 14px}.simg{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-bottom:14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.bar{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{font:600 1.35rem "Cormorant Garamond",serif;color:var(--g);text-decoration:none}
nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0;align-items:center}
nav a,nav button.t{font:500 .95rem Inter,sans-serif;color:var(--ink);text-decoration:none;background:none;border:0;padding:10px 12px;cursor:pointer;border-radius:6px}
nav a:hover,nav button.t:hover{color:var(--g);background:var(--bg2)}
.dd{position:relative}.dd .menu{display:none;position:absolute;top:100%;left:0;min-width:260px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.12)}
.dd.open .menu{display:block}.menu a{display:block}
.btn{display:inline-block;font:600 .98rem Inter,sans-serif;padding:13px 24px;border-radius:999px;border:1.5px solid var(--g);background:var(--g);color:var(--on-g)!important;text-decoration:none;cursor:pointer;transition:background .2s,transform .2s}
.btn:hover{transform:translateY(-1px);background:var(--sage);border-color:var(--sage)}
.btn.o{background:transparent;color:var(--g)!important}.btn.o:hover{background:var(--bg2);border-color:var(--g)}
.btn[disabled]{opacity:.6;cursor:wait;transform:none}
nav a.cta{background:var(--g);color:var(--on-g);border-radius:999px;padding:10px 20px}nav a.cta:hover{background:var(--sage);color:var(--on-g)}
.burger{display:none}
@media(max-width:900px){.burger{display:block;background:none;border:1.5px solid var(--g);color:var(--g);padding:8px 14px;border-radius:999px;font:600 .9rem Inter}
nav{display:none;position:absolute;top:72px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 22px 20px}nav.open{display:block}
nav ul{flex-direction:column;align-items:stretch}.dd .menu{position:static;box-shadow:none;border:0;padding-left:14px}}
section{padding:78px 0;border-top:1px solid var(--line)}section.first{border:0}.alt{background:var(--bg2)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
@media(max-width:820px){.hero,.two{grid-template-columns:1fr!important}}
.lead{font-size:1.2rem;color:var(--mute)}.row{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.ph{aspect-ratio:4/5;border-radius:200px 200px 14px 14px;background:linear-gradient(160deg,var(--champ),var(--sage));display:flex;align-items:flex-end;justify-content:center;padding:22px;text-align:center;color:#1b2a21;font-size:.88rem}
.ph span{background:rgba(250,247,240,.85);padding:8px 12px;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px}
.card h3{margin-bottom:.3em}.card a.more{font-weight:600}
.note{border-left:4px solid var(--champ);background:var(--card);padding:14px 18px;font-size:.95rem;color:var(--mute);margin:20px 0;max-width:68ch}
.todo{background:#f3e7c4;color:#4a3a10;padding:1px 7px;border-radius:4px;font-size:.88em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
details{border-bottom:1px solid var(--line)}summary{cursor:pointer;padding:18px 4px;font:600 1.15rem "Cormorant Garamond",serif;color:var(--g);list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}summary:after{content:"+";transition:transform .25s}details[open] summary:after{transform:rotate(45deg)}
details .in{padding:0 4px 20px;color:var(--mute)}
form{display:grid;gap:18px;max-width:640px}label{font-weight:500;font-size:.95rem;display:block;margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:#b3261e}
.err{color:#b3261e;font-size:.88rem;min-height:1em;margin-top:4px}@media(prefers-color-scheme:dark){.err{color:#f2998f}}
.chk{display:flex;gap:10px;align-items:flex-start}.chk input{width:auto;margin-top:6px}
.status{padding:16px 20px;border-radius:8px;border:1.5px solid var(--g);background:var(--card);max-width:640px}
.status.bad{border-color:#b3261e}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 24px}.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:7px 15px;border-radius:999px;cursor:pointer;font:inherit;font-size:.9rem}.chip[aria-pressed=true]{background:var(--g);color:var(--on-g);border-color:var(--g)}
.map{width:100%;height:340px;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
footer{background:var(--g);color:var(--on-g);padding:54px 0 30px;margin-top:0}footer a{color:var(--on-g)}footer h3{color:var(--on-g);font-size:1.15rem}
footer ul{list-style:none;padding:0;margin:0}footer li{margin-bottom:6px}.fine{font-size:.85rem;opacity:.85;margin-top:28px;border-top:1px solid rgba(250,247,240,.25);padding-top:18px;max-width:none}
@media(prefers-reduced-motion:no-preference){main{animation:in .45s ease}@keyframes in{from{opacity:0}to{opacity:1}}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;left:-999px}.sr:focus{left:10px;top:10px;background:#fff;color:#000;padding:8px;z-index:50}
</style>

  {id:"prep",cat:"Appointments",t:"Preparing for a gynecology appointment",s:"A few simple steps can make your visit calmer and more useful.",b:"Write down your questions and any symptoms you want to discuss, including when they started. Note the first day of your last period if you know it, and bring a list of current medications and any previous test results. If you are unsure about anything, say so. Your doctor would rather answer a question than have you leave without one."},
  {id:"expect",cat:"Appointments",t:"What to expect at a routine consultation",s:"Most visits begin with a conversation.",b:"A routine visit usually starts with a discussion of your health history and any concerns. Depending on your needs, your doctor may suggest an examination or tests and will explain each step first. You can ask questions or pause at any point. What happens at your visit depends on your own circumstances."},
  {id:"preventive",cat:"Prevention",t:"Understanding preventive women’s health visits",s:"Why check-ins matter even when you feel well.",b:"Preventive visits are a chance to talk about screening, contraception, vaccinations and changes you may have noticed. How often you need to be seen, and which tests are right for you, depends on your age and health. Ask your doctor what schedule fits you."},
  {id:"questions",cat:"Appointments",t:"Questions to ask your gynecologist",s:"A starting list you can adapt.",b:"You might ask: What do you think is causing my symptoms? What are my options, and what are the benefits and risks of each? Do I need tests, and when will I hear results? When should I come back, and what signs mean I should call sooner?"},
  {id:"pregnancy",cat:"Pregnancy",t:"Understanding pregnancy care options",s:"Publish only if obstetric services are confirmed.",b:"[Draft: describe the pregnancy care the practice provides, and where care is shared or referred. Hidden until confirmed.]",draft:true}],
 policy:"Appointment requests are subject to confirmation. Please provide accurate contact details so the practice can respond to your request. If you need to cancel or reschedule, contact the practice as early as possible. Appointment availability, consultation fees, cancellation terms, and virtual appointment arrangements will be confirmed by the practice. This website is not intended for emergencies."
};

const $=s=>document.querySelector(s),svcs=()=>CONFIG.services.filter(s=>s.confirmed||CONFIG.showDrafts);
const arts=()=>CONFIG.articles.filter(a=>!a.draft||CONFIG.showDrafts);
const TODO=t=>`<span class="todo">${t} — confirm before publication</span>`;
const portrait=()=>CONFIG.aboutPhoto?`<img class="pic" src="${CONFIG.aboutPhoto}" alt="Portrait of Dr. Ulrike K. Steiner">`:`<div class="ph" role="img" aria-label="Portrait placeholder"><span>Portrait placeholder</span></div>`;
const spec=()=>CONFIG.specialtyConfirmed?CONFIG.specialty:"Gynecology (to be confirmed)";
const cta=`<section class="alt"><div class="wrap"><h2>Need care during your pregnancy?</h2><p class="lead">Schedule a consultation with Dr. Ulrike K. Steiner to discuss your pregnancy and create a care plan tailored to you. Requests are confirmed by the practice.</p><a class="btn" href="#book">Book an Appointment</a></div></section>`;
const urgent=`<p class="note"><strong>Not for emergencies.</strong> Do not use this website for urgent medical concerns. In an emergency call 911 or go to your nearest emergency department.</p>`;
const mapBlock=()=>`<h3>Location</h3><p>${CONFIG.mapIsClinic?`<strong>${CONFIG.address}</strong><br>Office hours: ${CONFIG.hours}`:"General Calgary map view. This does <strong>not</strong> mark the practice; an exact address will be added once confirmed."}</p>
<p><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(CONFIG.mapQuery)}" target="_blank" rel="noopener">Get directions in Google Maps</a>.</p>`;
function accordion(){const l=svcs();if(!l.length)return `<div class="note">The services list is being finalized. Please <a href="#contact">contact the practice</a> to ask what care is offered.</div>`;
 const cats=[...new Set(l.map(s=>s.cat))];
 return cats.map(c=>`<h2 style="margin-top:34px;font-size:1.7rem">${c}</h2>`+l.filter(s=>s.cat==c).map(s=>`<details><summary>${s.t}${s.confirmed?"":" (draft)"}</summary><div class="in">${s.img?`<img class="simg" src="${s.img}" alt="${s.t}">`:""}<p>${s.d}</p><a href="#svc-${s.id}">Read more about this service</a></div></details>`).join("")).join("")}

home:{t:"Home",m:"Personalized gynecological care in Calgary with Dr. Ulrike K. Steiner.",h:()=>`
<section class="first"><div class="wrap hero"><div><h1>Thoughtful pregnancy care, centered on you.</h1><p class="lead">Personalized, evidence-based care for you and your baby, from antenatal monitoring through delivery and postpartum recovery.</p><div class="row"><a class="btn" href="#book">Book an Appointment</a><a class="btn o" href="#services">Explore Services</a></div></div>
${portrait()}</div></section>
<section><div class="wrap two"><div><h2>Meet Dr. Steiner</h2><p>Dr. Steiner is an internationally trained, board-certified Obstetrician and Gynecologist with over a decade of clinical experience, specializing in comprehensive pregnancy and maternal care in ${CONFIG.city}.</p><a href="#about">Read her full profile</a></div>
<div class="card"><h3>Credentials</h3><p>Verified credentials will appear here once supplied and confirmed.</p>${CONFIG.credentials.filter(c=>c.confirmed).map(c=>`<p><strong>${c.label}:</strong> ${c.value}</p>`).join("")}</div></div></section>
<section class="alt"><div class="wrap"><h2>Services</h2>${svcs().length?`<div class="grid">${svcs().slice(0,3).map(s=>`<div class="card"><h3>${s.t}</h3><p>${s.d}</p><a class="more" href="#svc-${s.id}">Learn more</a></div>`).join("")}</div>`:`<p>The services list is being finalized.</p>`}<p style="margin-top:22px"><a href="#services">View all services</a></p></div></section>
<section><div class="wrap"><h2>What to expect</h2><div class="grid"><div class="card"><h3>1. Send a request</h3><p>Choose a visit type and preferred time. This is a request, not a confirmed booking.</p></div><div class="card"><h3>2. The practice replies</h3><p>You will be contacted to confirm availability, fees and arrangements.</p></div><div class="card"><h3>3. Your visit</h3><p>Come with your questions. Each step is explained before it happens.</p></div></div></div></section>
<section class="alt"><div class="wrap"><h2>Patient resources</h2><div class="grid">${arts().slice(0,3).map(a=>`<div class="card"><h3>${a.t}</h3><p>${a.s}</p><a class="more" href="#resources">Read more</a></div>`).join("")}</div></div></section>
<section><div class="wrap two"><div><h2>Contact</h2><p>${CONFIG.city}<br><a href="mailto:${CONFIG.email}">${CONFIG.email}</a><br><a href="${CONFIG.x}" target="_blank" rel="noopener">@Ulrike_st on X</a></p><a class="btn o" href="#contact">Contact the practice</a></div><div>${mapBlock()}</div></div></section>${cta}`},
about:{t:"About",m:"About Dr. Ulrike K. Steiner, gynecology, Calgary.",h:()=>`
<section class="first"><div class="wrap two"><div><h1>About Dr. Steiner</h1><p class="lead">Dr. Ulrike K. Steiner is an internationally trained, board-certified Obstetrician and Gynecologist specializing in comprehensive pregnancy and maternal care.</p><p>She earned her Medical Degree in 2008 and completed her specialist training in Obstetrics and Gynecology in 2013, followed by advanced training in high-risk obstetrics and maternal-fetal care in 2014.</p><p>With over a decade of clinical experience, Dr. Steiner provides personalized care throughout pregnancy, from antenatal monitoring and prenatal screening to labor, delivery, Caesarean section, and postpartum recovery.</p><h2>Clinical focus</h2><p>Her practice focuses on safe, evidence-based care for both mother and baby, with particular expertise in monitoring high-risk pregnancies and managing pregnancy complications. She is committed to ensuring that every woman feels informed, supported, and confident throughout her pregnancy journey.</p><a class="btn" href="#book">Book an Appointment</a></div>${portrait()}</div></section>
<section class="alt"><div class="wrap"><h2>Education, training and affiliations</h2>${CONFIG.credentials.map(c=>`<details open><summary>${c.label}</summary><div class="in">${c.confirmed?c.value:TODO(c.value)}</div></details>`).join("")}</div></section>${cta}`},
services:{t:"Services",m:"Gynecology services offered by Dr. Ulrike K. Steiner in Calgary.",h:()=>`<section class="first"><div class="wrap"><h1>Services</h1><p class="lead">Care explained in everyday language. Open any item to read more.</p>${CONFIG.showDrafts?`<p class="note">Preview mode: unconfirmed draft services are visible. Turn off <code>showDrafts</code> before launch.</p>`:""}${accordion()}</div></section>${cta}`},
resources:{t:"Patient Resources",m:"Patient education on gynecology and women’s health.",h:()=>`<section class="first"><div class="wrap"><h1>Patient resources</h1><p class="lead">General information to help you prepare. It is not medical advice and does not replace a visit with a doctor.</p><label for="q">Search</label><input id="q" type="search" placeholder="Search articles" style="max-width:380px"><div class="chips" id="chips"></div><div id="alist" aria-live="polite"></div></div></section>${cta}`,
 after(){let cat="All",q="";const cats=["All",...new Set(arts().map(a=>a.cat))];const r=()=>{$("#chips").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c==cat}" data-c="${c}">${c}</button>`).join("");
  const l=arts().filter(a=>(cat=="All"||a.cat==cat)&&(a.t+a.s+a.b).toLowerCase().includes(q));
  $("#alist").innerHTML=l.length?l.map(a=>`<details><summary>${a.t}</summary><div class="in"><p>${a.b}</p></div></details>`).join(""):`<p class="note">No articles match. Clear the search or choose another category.</p>`;};
  $("#chips").onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;r()}};$("#q").oninput=e=>{q=e.target.value.toLowerCase();r()};r()}},
contact:{t:"Contact",m:"Contact Dr. Ulrike K. Steiner, Calgary, Alberta.",h:()=>`<section class="first"><div class="wrap two"><div><h1>Contact</h1><p><strong>${CONFIG.name}</strong><br>${CONFIG.address}<br>Hours: ${CONFIG.hours}<br><a href="mailto:${CONFIG.email}">${CONFIG.email}</a><br><a href="${CONFIG.x}" target="_blank" rel="noopener">@Ulrike_st on X</a></p>${urgent}<div id="fc"></div></div><div>${mapBlock()}</div></div></section>`,
 after(){mkForm("#fc","contact",[["name","Full name","text",1],["phone","Phone number","tel",0],["email","Email address","email",1],["location","Your location (city)","text",0],["message","Message","area",1]],"Send")}},
book:{t:"Book an Appointment",m:"Request an appointment with Dr. Ulrike K. Steiner.",h:()=>`<section class="first"><div class="wrap"><h1>Request an appointment</h1><p class="lead">This sends a request only. Nothing is booked until the practice confirms with you.</p>${urgent}<div id="fb"></div><p class="note"><strong>Booking policy.</strong> ${CONFIG.policy} <a href="#policy">Full policy</a></p></div></section>`,
 after(){const t=new Date();t.setMinutes(t.getMinutes()-t.getTimezoneOffset());mkForm("#fb","appointment",[["name","Full name","text",1],["email","Email address","email",1],["phone","Phone number","tel",1],["type","Appointment type",CONFIG.appointmentTypes.filter(x=>x.on).map(x=>x.v),1],["service","Requested service",["General consultation / not sure",...svcs().map(s=>s.t)],1],["date","Preferred date","date",1,t.toISOString().slice(0,10)],["time","Preferred time or range (e.g. mornings)","text",1],["message","Reason for visit (keep it brief; no detailed medical history)","area",0]],"Request appointment")}},
policy:{t:"Booking Policy",m:"Booking policy.",h:()=>`<section class="first"><div class="wrap"><h1>Booking policy</h1><p>${CONFIG.policy}</p><p class="note">${TODO("Review against the practice’s actual policies and applicable Alberta requirements")}</p></div></section>`},
privacy:{t:"Privacy Policy",m:"Privacy policy.",h:()=>`<section class="first"><div class="wrap"><h1>Privacy policy</h1><p>This website collects only the details you enter in its forms (name, contact details and a short message) so the practice can respond. Do not send detailed medical information through these forms.</p><p class="note">${TODO("Draft only. Have this reviewed against Alberta’s Health Information Act, PIPA and PIPEDA as applicable")}</p></div></section>`},

};
function mkForm(sel,kind,fields,label){let busy=false;const h=fields.map(([n,l,t,req,min])=>{const r=req?" *":"";const id=kind+"_"+n,a=`id="${id}" name="${n}" ${req?'required aria-required="true"':""} aria-describedby="${id}_e"`;
 const inp=Array.isArray(t)?`<select ${a}><option value="">Select…</option>${t.map(o=>`<option>${o}</option>`).join("")}</select>`:t=="area"?`<textarea ${a} rows="4"></textarea>`:`<input ${a} type="${t}" ${min?`min="${min}"`:""}>`;
 return `<div><label for="${id}">${l}${r}</label>${inp}<div class="err" id="${id}_e"></div></div>`}).join("");
 const consent=kind=="appointment"?`<div><div class="chk"><input type="checkbox" id="${kind}_consent" required aria-describedby="${kind}_consent_e"><label for="${kind}_consent">I have read the <a href="#privacy">privacy notice</a> and understand this is a request that the practice must confirm. *</label></div><div class="err" id="${kind}_consent_e"></div></div>`:"";
 $(sel).innerHTML=`<form novalidate>${h}${consent}<div><button class="btn" type="submit">${label}</button></div><div id="${kind}_s" role="status" aria-live="polite"></div></form>`;
 const f=$(sel+" form"),st=$("#"+kind+"_s");
 f.onsubmit=async e=>{e.preventDefault();if(busy)return;let ok=true,first=null;const d={};
  fields.forEach(([n,,t,req])=>{const el=f.elements[n],er=$("#"+kind+"_"+n+"_e");let m="";d[n]=el.value.trim();
   if(req&&!d[n])m="This field is required.";else if(t=="email"&&d[n]&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d[n]))m="Enter a valid email address.";else if(n=="date"&&d[n]&&d[n]<el.min)m="Choose today or a later date.";
   er.textContent=m;el.setAttribute("aria-invalid",!!m);if(m){ok=false;first=first||el}});
  const c=f.elements[kind+"_consent"];if(c){const m=c.checked?"":"Please confirm to continue.";$("#"+kind+"_consent_e").textContent=m;if(m){ok=false;first=first||c}}
  if(!ok){first.focus();return}
  const body=Object.entries(d).map(([k,v])=>k+": "+v).join("\n");
  const mail=`<a class="btn o" href="mailto:${CONFIG.email}?subject=${encodeURIComponent(kind=="appointment"?"Appointment request":"Website enquiry")}&body=${encodeURIComponent(body)}">Email this request instead</a>`;
  if(!CONFIG.formEndpoint){st.innerHTML=`<div class="status bad"><strong>Not sent.</strong> Online submission is not connected yet, so nothing was received by the practice. You can send the same details by email.<div class="row">${mail}</div></div>`;return}
  busy=true;const b=f.querySelector("button");b.disabled=true;b.textContent="Sending…";st.textContent="";
  try{const r=await fetch(CONFIG.formEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind,...d})});if(!r.ok)throw 0;
   f.reset();st.innerHTML=`<div class="status" tabindex="-1" id="${kind}_ok"><strong>${kind=="appointment"?"Request received.":"Message sent."}</strong> ${kind=="appointment"?"This is not a confirmed appointment. The practice will contact you to confirm.":"The practice will reply by email or phone."}</div>`;$("#"+kind+"_ok").focus()}
  catch(_){st.innerHTML=`<div class="status bad"><strong>Could not send.</strong> Please try again, or email the practice directly.<div class="row">${mail}</div></div>`}
  busy=false;b.disabled=false;b.textContent=label}}
function route(){let h=(location.hash||"#home").slice(1),pg=P[h],m=$("#main");
 if(h.startsWith("svc-")){const s=svcs().find(x=>"svc-"+x.id==h);pg=s?{t:s.t,m:s.d,h:()=>`<section class="first"><div class="wrap"><p><a href="#services">← All services</a></p><h1>${s.t}</h1><p class="lead">${s.d}</p>${s.img?`<img class="simg" style="max-height:420px;max-width:760px" src="${s.img}" alt="${s.t}">`:""}<p class="note">General information only, not medical advice.</p><a class="btn" href="#book">Inquire about an appointment</a></div></section>`}:null}
 if(!pg)pg={t:"Page not found",m:"",h:()=>`<section class="first"><div class="wrap"><h1>Page not found</h1><p>That page does not exist or is not published. <a href="#home">Return home</a>.</p></div></section>`};
 m.innerHTML=pg.h();pg.after&&pg.after();document.title=pg.t+" | "+CONFIG.name;document.querySelector('meta[name=description]').content=pg.m||"";
 $("#nav").classList.remove("open");$("#burger").setAttribute("aria-expanded","false");document.querySelectorAll(".dd").forEach(d=>d.classList.remove("open"));window.scrollTo(0,0);m.focus({preventScroll:true})}

 const tb=()=>{const o=CONFIG.open,n=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Edmonton"})),hr=n.getHours()+n.getMinutes()/60,on=o.days.includes(n.getDay())&&hr>=o.from&&hr<o.to;$("#topbar").innerHTML=`<span class="dot" style="background:${on?"#7fd6a0":"#b9b5a5"}"></span>${on?"Open now":"Currently closed"} — office hours ${CONFIG.hours} (Calgary time)`};tb();setInterval(tb,60000);$("#navlist").innerHTML=`<li><a href="#home">Home</a></li><li><a href="#about">About</a></li><li class="dd"><button class="t" aria-expanded="false" aria-haspopup="true" id="ddb">Services ▾</button><div class="menu"><a href="#services">All services</a>${l.map(s=>`<a href="#svc-${s.id}">${s.t}</a>`).join("")}</div></li><li><a href="#resources">Patient Resources</a></li><li><a href="#contact">Contact</a></li><li><a class="cta" href="#book">Book an Appointment</a></li>`;
 const dd=$(".dd"),b=$("#ddb");b.onclick=()=>{const o=dd.classList.toggle("open");b.setAttribute("aria-expanded",o)};
 dd.addEventListener("keydown",e=>{if(e.key=="Escape"){dd.classList.remove("open");b.setAttribute("aria-expanded","false");b.focus()}});
 document.addEventListener("click",e=>{if(!dd.contains(e.target)){dd.classList.remove("open");b.setAttribute("aria-expanded","false")}});

 $("#skip").onclick=e=>{e.preventDefault();$("#main").focus()};
 $("#foot").innerHTML=`<div class="grid"><div><h3>${CONFIG.name}</h3><p>${spec()}<br>${CONFIG.address}<br><a href="mailto:${CONFIG.email}">${CONFIG.email}</a><br><a href="${CONFIG.x}" target="_blank" rel="noopener">X / Twitter</a></p></div><div><h3>Explore</h3><ul><li><a href="#home">Home</a></li><li><a href="#about">About</a></li><li><a href="#services">Services</a></li><li><a href="#resources">Patient Resources</a></li><li><a href="#contact">Contact</a></li><li><a href="#book">Book an Appointment</a></li></ul></div><div><h3>Legal</h3><ul><li><a href="#privacy">Privacy Policy</a></li><li><a href="#policy">Booking Policy</a></li><li><a href="#disclaimer">Medical disclaimer</a></li></ul></div></div><p class="fine">© ${new Date().getFullYear()} ${CONFIG.name}. Not for emergencies: call 911. Information on this site is general and not medical advice.</p>`}
chrome();route();addEventListener("hashchange",route);
